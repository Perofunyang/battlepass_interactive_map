<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Map Service</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            height: 100vh;
            background-color: #1a1a1a;
            color: #fff;
        }

        /* 사이드바 */
        #sidebar {
            width: 300px;
            background-color: #242424;
            border-right: 1px solid #333;
            display: flex;
            flex-direction: column;
            z-index: 1000;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid #333;
        }

            .sidebar-header h2 {
                font-size: 1.2rem;
                margin-bottom: 10px;
                color: #e5b35c;
            }

        .map-select-box {
            width: 100%;
            padding: 10px;
            background-color: #1a1a1a;
            color: #fff;
            border: 1px solid #444;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
        }

        .filter-section {
            padding: 20px;
            flex: 1;
            overflow-y: auto;
        }

            .filter-section h3 {
                font-size: 0.9rem;
                margin-bottom: 15px;
                color: #aaa;
                text-transform: uppercase;
            }

        /* 카테고리 필터 항목 */
        .category-item {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            padding: 6px 8px;
            border-radius: 4px;
            cursor: pointer;
            user-select: none;
            transition: background-color 0.2s;
        }

            .category-item:hover {
                background-color: #333;
            }

            .category-item input[type="checkbox"] {
                margin-right: 10px;
                width: 18px;
                height: 18px;
                cursor: pointer;
            }

        .filter-icon-img {
            width: 20px;
            height: 20px;
            object-fit: contain;
            margin-right: 8px;
            vertical-align: middle;
        }

        .category-name {
            font-size: 0.95rem;
            font-weight: 500;
            display: flex;
            align-items: center;
        }

        /* 최상위 카테고리 팝업 박스 */
        #global-category-preview {
            display: none;
            position: fixed;
            z-index: 9999;
            border: 2px solid #e5b35c;
            border-radius: 8px;
            overflow: hidden;
            background-color: #1a1a1a;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.9);
            pointer-events: none;
            max-width: 300px;
        }

            #global-category-preview img {
                max-width: 300px;
                max-height: 200px;
                width: auto;
                height: auto;
                object-fit: contain;
                display: block;
                margin: 0 auto;
            }

        /* 메인 맵 영역 */
        #map-container {
            flex: 1;
            height: 100%;
            position: relative;
            background-color: #111;
        }

        #map {
            width: 100%;
            height: 100%;
            background: transparent;
        }

        /* 지도 위 커스텀 마커 이미지 크기 (20px) */
        .map-marker-img {
            width: 20px;
            height: 20px;
            object-fit: contain;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.9));
            cursor: pointer;
        }

        /* 좌하단 좌표 표시 오버레이 */
        #coord-overlay {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background-color: rgba(0, 0, 0, 0.85);
            border: 1px solid #e5b35c;
            color: #e5b35c;
            padding: 8px 14px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.95rem;
            font-weight: bold;
            z-index: 1000;
            pointer-events: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        /* 호버 툴팁: 마커 사진 노출 스타일 */
        .custom-tooltip-photo {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            padding: 0 !important;
        }

            .custom-tooltip-photo .leaflet-tooltip-pane {
                color: transparent;
            }

        .hover-photo-frame {
            border: 2px solid #e5b35c;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.8);
            background-color: #000;
            line-height: 0;
        }

            /* [수정] 호버 프리뷰 이미지 너비 480px로 조절 */
            .hover-photo-frame img {
                width: 480px;
                max-height: 300px;
                height: auto;
                object-fit: contain;
                display: block;
            }

        /* [신규] 화면 정중앙 모달 (상세 정보 창) 스타일 */
        .modal-backdrop {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.75);
            z-index: 10000; /* 최상위 레이어 */
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            position: relative;
            width: 600px; /* 요청하신 600px 너비 */
            max-width: 90vw;
            max-height: 85vh;
            background-color: #242424;
            border: 2px solid #e5b35c;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9);
            overflow-y: auto;
        }

        .modal-close-btn {
            position: absolute;
            top: 12px;
            right: 16px;
            background: none;
            border: none;
            color: #aaa;
            font-size: 2rem;
            cursor: pointer;
            line-height: 1;
            transition: color 0.2s;
        }

            .modal-close-btn:hover {
                color: #e5b35c;
            }

        .modal-detail img {
            width: 100%;
            max-height: 360px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 16px;
        }

        .modal-detail h3 {
            font-size: 1.5rem;
            color: #e5b35c;
            margin-bottom: 10px;
        }

        .modal-detail p {
            font-size: 1rem;
            color: #ccc;
            line-height: 1.5;
        }
    </style>
</head>

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-DGBBM09F3J"></script>
<script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());

    gtag('config', 'G-DGBBM09F3J');
</script>

<body>

    <!-- 좌측 메인 컨트롤 사이드바 -->
    <div id="sidebar">
        <div class="sidebar-header">
            <h2>Interactive Map</h2>
            <select id="map-select" class="map-select-box" onchange="switchMap(this.value)">
                <option value="customs">Customs (세관)</option>
                <option value="ground_zero">Ground Zero (그라운드 제로)</option>
                <option value="factory" selected>Factory (공장)</option>
                <option value="woods">Woods (삼림)</option>
                <option value="reserve">Reserve (리저브)</option>
                <option value="shoreline">Shoreline (해안선)</option>
                <option value="interchange">Interchange (인터체인지)</option>
                <option value="lighthouse">Lighthouse (등대)</option>
                <option value="streets_of_tarkov">Streets of Tarkov (스오타)</option>
                <option value="lab">The Lab (연구실)</option>
                <option value="labyrinth">The Labyrinth (미궁)</option>
            </select>
        </div>

        <div class="filter-section">
            <h3>문서 종류 (총 필요 개수)</h3>
            <div id="category-filters"></div>
        </div>
    </div>

    <!-- 메인 맵 영역 -->
    <div id="map-container">
        <div id="map"></div>
        <div id="coord-overlay">Y: 0, X: 0 (클릭시 좌표 복사)</div>
    </div>

    <!-- 최상위 레이어로 동작할 단일 카테고리 팝업 박스 -->
    <div id="global-category-preview">
        <img id="global-preview-img" src="" alt="preview" />
    </div>

    <!-- [신규] 화면 정중앙 상세 정보 모달창 -->
    <div id="detail-modal" class="modal-backdrop">
        <div class="modal-content">
            <button class="modal-close-btn" onclick="closeDetailModal()">&times;</button>
            <div id="modal-body"></div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        const MAPS = {
            customs: { name: "Customs", imageUrl: "./assets/maps/customs.webp", width: 4097, height: 2142 },
            factory: { name: "Factory", imageUrl: "./assets/maps/factory.png", width: 850, height: 850 },
            ground_zero: { name: "Ground Zero", imageUrl: "./assets/maps/ground_zero.webp", width: 6920, height: 6920 },
            interchange: { name: "Interchange", imageUrl: "./assets/maps/interchange.webp", width: 9600, height: 5400 },
            lab: { name: "Lab", imageUrl: "./assets/maps/lab.webp", width: 3820, height: 2189 },
            labyrinth: { name: "Labyrinth", imageUrl: "./assets/maps/labyrinth.webp", width: 4145, height: 3840 },
            lighthouse: { name: "Lighthouse", imageUrl: "./assets/maps/lighthouse.webp", width: 2242, height: 3892 },
            reserve: { name: "Reserve", imageUrl: "./assets/maps/reserve.webp", width: 4701, height: 2785 },
            shoreline: { name: "Shoreline", imageUrl: "./assets/maps/shoreline.webp", width: 6668, height: 4567 },
            streets_of_tarkov: { name: "Streets of Tarkov", imageUrl: "./assets/maps/streets_of_tarkov.webp", width: 7620, height: 5877 },
            woods: { name: "Woods", imageUrl: "./assets/maps/woods.webp", width: 6994, height: 6843 }
        };

        const CATEGORIES = {
            technical: { name: "Technical(86개)", icon: "./assets/icons/technical.png", image: "./assets/category/technical.png" },
            pmc: { name: "PMC(39개)", icon: "./assets/icons/pmc.png", image: "./assets/category/pmc.png" },
            project: { name: "Project(55개)", icon: "./assets/icons/project.png", image: "./assets/category/project.png" },
            blueprints: { name: "Blueprints(81개)", icon: "./assets/icons/blueprints.png", image: "./assets/category/blueprints.png" },
            test: { name: "Test(48개)", icon: "./assets/icons/test.png", image: "./assets/category/test.png" },
            user: { name: "User(40개)", icon: "./assets/icons/user.png", image: "./assets/category/user.png" },
            medical: { name: "Medical(67개)", icon: "./assets/icons/medical.png", image: "./assets/category/medical.png" },
            financial: { name: "Financial(83개)", icon: "./assets/icons/financial.png", image: "./assets/category/financial.png" }
        };

        let map = null;
        let currentMapId = 'factory';
        let currentImageOverlay = null;
        const layerGroups = {};
        const activeFilters = new Set(Object.keys(CATEGORIES));

        function initMap() {
            map = L.map('map', {
                crs: L.CRS.Simple,
                minZoom: -5,
                maxZoom: 3,
                zoomSnap: 0.1,
                attributionControl: false
            });

            renderFilterUI();
            setupCoordinateTracker();
            setupModalEvents();
            loadMap(currentMapId);
        }

        function setupCoordinateTracker() {
            const coordDiv = document.getElementById('coord-overlay');

            map.on('mousemove', function (e) {
                const y = Math.round(e.latlng.lat);
                const x = Math.round(e.latlng.lng);
                coordDiv.innerText = `Y: ${y}, X: ${x}`;
            });

            map.on('click', function (e) {
                const y = Math.round(e.latlng.lat);
                const x = Math.round(e.latlng.lng);
                const coordString = `[${y}, ${x}],`;

                navigator.clipboard.writeText(coordString).then(() => {
                    coordDiv.innerText = `복사됨! -> ${coordString}`;
                    setTimeout(() => {
                        coordDiv.innerText = `Y: ${y}, X: ${x}`;
                    }, 1500);
                });
            });
        }

        /* [신규] 정중앙 모달 조작 이벤트 */
        function openDetailModal(data) {
            const modalBody = document.getElementById('modal-body');
            modalBody.innerHTML = `
                        <div class="modal-detail">
                            ${data.detailImg ? `<img src="${data.detailImg}" alt="detail" />` : ''}
                            ${data.detailTitle ? `<h3>${data.detailTitle}</h3>` : ''}
                            ${data.detailDesc ? `<p>${data.detailDesc}</p>` : ''}
                        </div>
                    `;
            document.getElementById('detail-modal').style.display = 'flex';

            // [GA4 추가] 유저가 클릭한 마커 정보 전송
            if (typeof gtag === 'function') {
                gtag('event', 'click_marker_detail', {
                    'map_id': currentMapId,
                    'category': data.category,
                    'marker_id': data.id || 'unknown',
                    'marker_title': data.detailTitle || data.id
                });
            }
        }

        function closeDetailModal() {
            document.getElementById('detail-modal').style.display = 'none';
        }

        function setupModalEvents() {
            // 배경 클릭 시 닫기
            document.getElementById('detail-modal').addEventListener('click', (e) => {
                if (e.target.id === 'detail-modal') {
                    closeDetailModal();
                }
            });

            // ESC 키 누를 때 닫기
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    closeDetailModal();
                }
            });
        }

        function loadMap(mapId) {
            currentMapId = mapId;
            const mapConfig = MAPS[mapId];

            map.setMaxBounds(null);
            if (currentImageOverlay) map.removeLayer(currentImageOverlay);
            clearAllMarkers();

            const bounds = [[0, 0], [mapConfig.height, mapConfig.width]];
            currentImageOverlay = L.imageOverlay(mapConfig.imageUrl, bounds).addTo(map);

            map.fitBounds(bounds, { animate: false });
            map.setMaxBounds(bounds);

            if (window[`MAP_DATA_${mapId}`]) {
                renderMarkers(window[`MAP_DATA_${mapId}`]);
                return;
            }

            const script = document.createElement('script');
            script.src = `./data/${mapId}.js`;

            script.onload = () => {
                const markersData = window[`MAP_DATA_${mapId}`] || [];
                renderMarkers(markersData);
            };

            script.onerror = () => {
                console.warn(`[알림] ./data/${mapId}.js 파일이 없거나 데이터가 빈 상태입니다.`);
                renderMarkers([]);
            };

            document.body.appendChild(script);
        }

        function switchMap(mapId) {
            loadMap(mapId);

            // [GA4 추가] 유저가 선택한 맵 이름을 구글 애널리틱스로 전송
            if (typeof gtag === 'function') {
                gtag('event', 'select_map', {
                    'map_id': mapId,
                    'map_name': MAPS[mapId] ? MAPS[mapId].name : mapId
                });
            }
        }

        function renderMarkers(markersData) {
            const mapConfig = MAPS[currentMapId];

            Object.keys(CATEGORIES).forEach(catKey => {
                layerGroups[catKey] = L.layerGroup();
                if (activeFilters.has(catKey)) {
                    layerGroups[catKey].addTo(map);
                }
            });

            markersData.forEach(data => {
                const catInfo = CATEGORIES[data.category];
                const iconSrc = catInfo ? catInfo.icon : '';

                const markerY = data.coords[0];
                const isTop = markerY > (mapConfig.height * 0.5);

                const tooltipDirection = isTop ? 'bottom' : 'top';
                const tooltipOffset = isTop ? [0, 15] : [0, -15];

                const customIcon = L.divIcon({
                    html: `<img src="${iconSrc}" class="map-marker-img" onError="this.onerror=null; this.src='https://via.placeholder.com/20?text=📍';" />`,
                    className: 'custom-map-icon',
                    iconSize: [20, 20],
                    iconAnchor: [10, 10]
                });

                const marker = L.marker(data.coords, { icon: customIcon });

                // 호버 프리뷰 툴팁 (너비 480px)
                if (data.previewImg) {
                    const tooltipHTML = `
                                <div class="hover-photo-frame">
                                  <img src="${data.previewImg}" alt="preview" />
                                </div>
                            `;

                    marker.bindTooltip(tooltipHTML, {
                        className: 'custom-tooltip-photo',
                        direction: tooltipDirection,
                        offset: tooltipOffset,
                        opacity: 1
                    });
                }

                // [수정] 클릭 시 화면 정중앙 모달 오픈
                if (data.detailImg || data.detailTitle || data.detailDesc) {
                    marker.on('click', () => {
                        openDetailModal(data);
                    });
                }

                if (layerGroups[data.category]) {
                    layerGroups[data.category].addLayer(marker);
                }
            });
        }

        function clearAllMarkers() {
            Object.keys(layerGroups).forEach(catKey => {
                map.removeLayer(layerGroups[catKey]);
            });
        }

        function renderFilterUI() {
            const container = document.getElementById('category-filters');
            container.innerHTML = '';

            const previewBox = document.getElementById('global-category-preview');
            const previewImg = document.getElementById('global-preview-img');

            Object.entries(CATEGORIES).forEach(([key, cat]) => {
                const item = document.createElement('label');
                item.className = 'category-item';
                item.innerHTML = `
                            <input type="checkbox" value="${key}" checked onchange="toggleCategory('${key}', this.checked)">
                            <span class="category-name">
                                <img src="${cat.icon}" class="filter-icon-img" onError="this.style.display='none';" />
                                ${cat.name}
                            </span>
                        `;

                item.addEventListener('mouseenter', () => {
                    const rect = item.getBoundingClientRect();
                    previewImg.src = cat.image;
                    previewImg.onerror = () => {
                        previewImg.src = `https://via.placeholder.com/220x140/222/e5b35c?text=${cat.name}`;
                    };

                    previewBox.style.top = `${rect.top}px`;
                    previewBox.style.left = `${rect.right + 10}px`;
                    previewBox.style.display = 'block';
                });

                item.addEventListener('mouseleave', () => {
                    previewBox.style.display = 'none';
                });

                container.appendChild(item);
            });
        }

        function toggleCategory(categoryKey, isChecked) {
            if (isChecked) {
                activeFilters.add(categoryKey);
                if (layerGroups[categoryKey]) map.addLayer(layerGroups[categoryKey]);
            } else {
                activeFilters.delete(categoryKey);
                if (layerGroups[categoryKey]) map.removeLayer(layerGroups[categoryKey]);
            }

            // [GA4 추가] 필터 조작 이벤트 전송
            if (typeof gtag === 'function') {
                gtag('event', 'filter_category', {
                    'category': categoryKey,
                    'state': isChecked ? 'on' : 'off'
                });
            }
        }

        window.onload = initMap;
    </script>
</body>
</html>
